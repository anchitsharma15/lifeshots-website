name: Publish GitHub Pages preview

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - ".github/workflows/pages-preview.yml"
      - "scripts/package_site.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source
        run: |
          python3 scripts/check_site.py
          node --check dist/app.js
      - name: Package preview with versioned assets and noindex
        run: python3 scripts/package_site.py --output pages-preview --preview --base-path /lifeshots-website/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-preview

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

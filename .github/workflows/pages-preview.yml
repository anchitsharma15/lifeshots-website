name: Publish GitHub Pages preview

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source
        run: |
          python3 scripts/check_site.py
          node --check dist/app.js
      - name: Prepare preview without search indexing
        run: |
          cp -R dist pages-preview
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          page = Path("pages-preview/index.html")
          html = page.read_text()
          # Match each page release to its CSS/JS, even when browsers cache old assets.
          for name in ("style.css", "app.js"):
              asset = page.parent / name
              version = sha256(asset.read_bytes()).hexdigest()[:12]
              versioned = asset.with_name(f"{asset.stem}.{version}{asset.suffix}")
              versioned.write_bytes(asset.read_bytes())
              html = html.replace(f'"{name}"', f'"{versioned.name}"')
          html = html.replace("</head>", '<meta name="robots" content="noindex, nofollow"></head>')
          page.write_text(html)
          Path("pages-preview/robots.txt").write_text("User-agent: *\nDisallow: /\n")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-preview

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
